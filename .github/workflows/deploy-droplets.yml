name: Deploy to Droplets

# Droplets auto-update every 2 minutes via systemd timer (pull-based).
# This workflow is optional — it triggers IMMEDIATE deploys via the API
# webhook if you don't want to wait for the next poll cycle.
#
# If DROPLET_URLS is not configured, this workflow is a no-op (that's fine,
# droplets will still pick up changes within 2 minutes).

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        default: "main"
        type: string

jobs:
  deploy:
    name: Trigger immediate deploy
    runs-on: ubuntu-latest
    # Only runs if webhook URLs are configured
    if: ${{ vars.DROPLET_URLS != '' || secrets.DROPLET_URLS != '' }}
    steps:
      - name: Trigger rolling deploy on each droplet
        env:
          # Comma-separated list of droplet API URLs
          # e.g. "https://api.droplet1.example.com,https://api.droplet2.example.com"
          DROPLET_URLS: ${{ secrets.DROPLET_URLS || vars.DROPLET_URLS }}
          INTERSERVICE_SECRET: ${{ secrets.INTERSERVICE_SECRET }}
          DEPLOY_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          IFS=',' read -ra URLS <<< "$DROPLET_URLS"
          FAILED=0
          TOTAL=${#URLS[@]}

          echo "Deploying to $TOTAL droplet(s)..."

          for URL in "${URLS[@]}"; do
            URL=$(echo "$URL" | xargs)
            echo "--- Triggering deploy on $URL ---"

            RESPONSE=$(curl -sf -X POST "$URL/deploy" \
              -H "Content-Type: application/json" \
              -H "X-Interservice-Secret: $INTERSERVICE_SECRET" \
              -d "{\"branch\": \"$DEPLOY_BRANCH\"}" 2>&1) || {
              echo "::warning::Failed to trigger deploy on $URL (droplet will still auto-update within 2 min)"
              FAILED=$((FAILED + 1))
              continue
            }
            echo "Triggered: $RESPONSE"

            # Poll for completion (max 5 minutes)
            for i in $(seq 1 30); do
              sleep 10
              STATUS=$(curl -sf "$URL/deploy-status" 2>&1) || continue

              DONE=$(echo "$STATUS" | jq -r '.done // false')
              SUCCESS=$(echo "$STATUS" | jq -r '.success // false')

              if [ "$DONE" = "true" ]; then
                if [ "$SUCCESS" = "true" ]; then
                  echo "Deploy to $URL succeeded!"
                else
                  echo "::warning::Deploy to $URL may have failed (check /deploy-status)"
                fi
                break
              fi

              echo "  Still deploying... ($((i * 10))s)"
            done
          done

          echo ""
          echo "Triggered $((TOTAL - FAILED))/$TOTAL droplets immediately."
          if [ $FAILED -gt 0 ]; then
            echo "::notice::$FAILED droplet(s) couldn't be reached but will auto-update within 2 minutes."
          fi
