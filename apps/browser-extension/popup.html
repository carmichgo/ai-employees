<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #fff;
    }
    .header {
      padding: 14px 16px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 24px; height: 24px; border-radius: 4px; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header .subtitle { font-size: 11px; opacity: 0.7; margin-top: 1px; }

    .status-bar {
      padding: 10px 16px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 6px;
    }
    .dot.green { background: #22c55e; }
    .dot.gray { background: #ccc; }

    .connections { padding: 8px 0; }
    .conn-item {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }
    .conn-item:last-child { border-bottom: none; }
    .conn-name { font-weight: 500; }
    .conn-status { font-size: 11px; color: #22c55e; }
    .conn-status.error { color: #ef4444; }

    .btn-disconnect {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      color: #666;
    }
    .btn-disconnect:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }

    .empty {
      padding: 30px 16px;
      text-align: center;
      color: #999;
    }
    .empty p { margin-bottom: 8px; }
    .empty a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 12px;
    }
    .empty a:hover { text-decoration: underline; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-disconnect-all {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-disconnect-all:hover { text-decoration: underline; }
    .footer a {
      font-size: 11px;
      color: #3b82f6;
      text-decoration: none;
    }

    .share-bar {
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
    }
    .btn-share {
      width: 100%;
      padding: 8px 12px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-share:hover { opacity: 0.9; }
    .btn-share:disabled { opacity: 0.5; cursor: default; }
    .btn-share .icon { font-size: 15px; }
    .share-status {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Blitzer AI</h1>
      <div class="subtitle">Browser Relay</div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <span><span class="dot gray" id="statusDot"></span><span id="statusText">No connections</span></span>
  </div>

  <div id="shareBar" class="share-bar" style="display: none;">
    <button class="btn-share" id="shareTab">
      <span class="icon">+</span> Share this tab
    </button>
    <div class="share-status" id="shareStatus"></div>
  </div>

  <div id="content"></div>

  <div class="footer" id="footer" style="display: none;">
    <button class="btn-disconnect-all" id="disconnectAll">Disconnect All</button>
    <a href="https://www.blitzerai.com/dashboard" target="_blank">Dashboard →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
